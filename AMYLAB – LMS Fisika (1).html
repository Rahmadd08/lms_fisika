<script>
const $=s=>document.querySelector(s),CODE='RAMADHANI0110',/* KODE/PASSWORD GURU */norm=x=>String(x||'').normalize('NFKC').replace(/[\s\u200b-\u200d\ufeff]/g,'').toUpperCase();

if(mode=='reg'){if(!v('n').trim())return er('Nama wajib diisi.');if(DB.users.find(u=>u.email==e))return er('Akun sudah terdaftar, silakan masuk.');DB.users.push({email:e,pass:p,role,nama:v('n').trim()});save();me=DB.users.at(-1)}

function rst2(){if(v('c')!=rs.code)return er('Kode salah.');if(v('p').length<6)return er('Password minimal 6 karakter.');DB.users.find(u=>u.email==rs.e).pass=v('p');save();rs=null;mode='login';authUI();alert('Password berhasil diganti. Silakan masuk.')}
const MENU=[['dash','🏠 Dashboard'],['akt','🗺️ Aktivitas Belajar'],['pre','📝 Pretest'],['mat','📖 Materi'],['vid','🎬 Video Fenomena'],['sim','⚙️ Simulasi'],['prak','🔬 Praktikum (LKPD)'],['dis','💬 Ruang Diskusi'],['post','✅ Posttest'],['ref','🪞 Refleksi'],['kel','🎥 Kelas Online'],['rek','📊 Rekapitulasi Nilai'],['pus','📚 Daftar Pustaka']];
{const o=['dash','akt','pre','vid','mat','sim','prak','dis','lat','post','rem','ref','kel','rek','pus'];MENU.push(['lat','✍️ Latihan Soal Kontekstual']);MENU.push(['rem','🔁 Remedial']);MENU.sort((a,b)=>o.indexOf(a[0])-o.indexOf(b[0]))}

const CAR=`<rect x="272" y="70" width="116" height="22" rx="5" fill="#d93025"/><path d="M296 70L308 52H352L364 70Z" fill="#d93025"/><path d="M311 68L318 56H332V68ZM336 68V56H348L356 68Z" fill="#cfe8ff"/><circle cx="300" cy="93" r="7" fill="#333"/><circle cx="360" cy="93" r="7" fill="#333"/>`,CHAIR=`<rect x="300" y="96" width="60" height="4" fill="#555"/><rect x="325" y="86" width="10" height="10" fill="#555"/><rect x="290" y="78" width="80" height="8" rx="3" fill="#8d5524"/><rect x="290" y="44" width="10" height="36" rx="3" fill="#8d5524"/><circle cx="332" cy="46" r="8" fill="#f1c27d"/><rect x="320" y="54" width="24" height="24" rx="4" fill="#1a73e8"/><rect x="340" y="70" width="28" height="8" rx="3" fill="#1a73e8"/>`;

function sc(){const n=QZ.post.length,pd=PD(),a=pd.filter(x=>x!=null).length,b=pd.filter((x,i)=>x!=null&&x==QZ.post[i][2]).length;return{n,a,b,s:Math.round(b*100/n)}}
function sbar(){const e=document.getElementById('sbar');if(!e)return;const t=sc();e.innerHTML=`<b>Nilai sementara: <span class="${t.s>=KKM?'ok':''}">${t.s}</span></b> &middot; Benar ${t.b} dari ${t.a} soal dijawab &middot; ${t.a}/${t.n} soal<div class="pbar"><i style="width:${t.a*100/t.n}%"></i></div>`}
function aiTxt(i,j){const q=QZ.post[i],pd=PD();let st=0,w=0;for(let x=0;x<=i;x++){if(pd[x]==null)continue;if(pd[x]==QZ.post[x][2])st++;else{st=0;w++}}
if(j==q[2])return `${PR[q[3]]}${st>=3?` Sudah ${st} jawaban benar berturut-turut, pertahankan!`:''}`;
return `Kamu memilih opsi <b>${AB[j]}</b>. ${(q[6]||[])[j]||''} <b>Saran:</b> ${TIP[q[3]]} ${w>=3?'Konsep dasarnya perlu dimantapkan: buka kembali materi Hukum Pascal, lalu lanjutkan dengan tenang.':'Kamu pasti bisa pada soal berikutnya!'}`}
async function aiRemote(i,j){if(!AI_URL)return;const q=QZ.post[i],e=document.getElementById('ai'+i);if(!e)return;try{const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);const r=await fetch(AI_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({soal:q[0],pilihan:q[1].map((o,x)=>AB[x]+'. '+o),dipilih:AB[j],kunci:AB[q[2]],level:q[3],pembahasan:q[5]}),signal:c.signal});clearTimeout(t);const d=await r.json();if(d.feedback)e.textContent=d.feedback}catch(_){}}
function fbHTML(i,j){const q=QZ.post[i],pt=(100/QZ.post.length).toFixed(1).replace('.',','),ai=`<div class="ai">🤖 <b>Asisten Umpan Balik:</b> <span id="ai${i}">${aiTxt(i,j)}</span></div>`;
return j==q[2]?`<div class="fb fok"><b>✔ Benar! +${pt} poin</b>${ai}</div>`:`<div class="fb fer"><b>✘ Jawabanmu belum tepat.</b> Jawaban benar: <b>${AB[q[2]]}. ${q[1][q[2]]}</b><div class="pb"><b>📘 Pembahasan:</b> ${q[5]}</div>${ai}</div>`}
const qb=(q,i)=>`<p style="margin:6px 0 2px"><b>${i+1}.</b> <span class="lv">${LV[q[3]]||''}</span></p><p style="margin:2px 0"><b>${q[0]}</b></p>${q[4]||''}`;
function pq(i,j){const q=QZ.post[i];return `<div class="q" id="pq${i}">${qb(q,i)}${q[1].map((o,x)=>`<label class="${j!=null?(x==q[2]?'okopt':x==j?'badopt':''):''}"><input type="radio" name="post${i}" value="${x}" ${j!=null?'disabled':''} ${j==x?'checked':''} onchange="pa(${i},${x})"><b>${AB[x]}.</b>&nbsp;${o}</label>`).join('')}${j!=null?fbHTML(i,j):''}</div>`}
function pa(i,j){const pd=PD();if(pd[i]!=null)return;pd[i]=j;save();document.getElementById('pq'+i).outerHTML=pq(i,j);sbar();aiRemote(i,j)}
function quiz(k){const d=gv(k);if(d.s!=null)return qres(k);
if(k=='post'){const pd=PD();setTimeout(sbar,0);return `<div id="sbar" class="sbar"></div>`+QZ.post.map((q,i)=>pq(i,pd[i]==null?null:pd[i])).join('')+`<button onclick="sub('post')">Selesai &amp; Kirim Nilai</button>`}
return QZ[k].map((q,i)=>`<div class="q">${q[3]?qb(q,i):`<b>${i+1}. ${q[0]}</b>`}${q[1].map((o,j)=>`<label><input type="radio" name="${k}${i}" value="${j}"><b>${AB[j]}.</b>&nbsp;${o}</label>`).join('')}</div>`).join('')+`<button onclick="sub('${k}')">Kirim Jawaban</button>`}
function qres(k){const d=gv(k),n=QZ[k].length,b=d.a.filter((x,i)=>x==QZ[k][i][2]).length;let h=`<h2 class="${d.s>=KKM?'ok':'err'}">Skor: ${d.s}</h2><p class="mu">Benar ${b} dari ${n} soal.</p>`;
if(k=='pre')return h+`<p class="mu">Pembahasan jawaban ditampilkan setelah kamu mengerjakan Posttest.</p>`;
return h+QZ[k].map((q,i)=>`<div class="q">${q[3]?qb(q,i):`<b>${i+1}. ${q[0]}</b>`}<p>Jawabanmu: ${d.a[i]==null?'(kosong)':AB[d.a[i]]+'. '+q[1][d.a[i]]} ${d.a[i]==q[2]?'<b class="ok">✔ Benar</b>':'<b class="err">✘ Jawaban benar: '+AB[q[2]]+'. '+q[1][q[2]]+'</b>'}</p>${d.a[i]!=q[2]&&q[5]?`<div class="fb fer"><b>📘 Pembahasan:</b> ${q[5]}</div>`:''}</div>`).join('')}
function sub(k){const a=k=='post'?QZ.post.map((q,i)=>{const v=PD()[i];return v==null?null:v}):QZ[k].map((q,i)=>{const x=document.querySelector(`input[name="${k}${i}"]:checked`);return x?+x.value:null});if(a.includes(null)&&!confirm('Ada soal belum dijawab. Kirim?'))return;const s=Math.round(a.filter((x,i)=>x==QZ[k][i][2]).length*100/QZ[k].length);R()[k]={s,a,t:new Date().toLocaleString('id-ID'),n:((R()[k]||{}).n||0)+1,best:Math.max((R()[k]||{}).best||0,s)};if(k=='post')delete R().pd;save();if(k=='post'&&s<KKM){alert('Skor '+s+' belum mencapai KKM '+KKM+'. Kamu otomatis diarahkan ke Remedial.');page='rem'}nav()}

P.mat=()=>`<div class='book'><div class='bh'><span>MODUL AMYLAB · Fisika · Fluida Statis</span><span id='pn'></span></div>
<section class='pg'><h1>Hukum Pascal</h1><p><i>Modul Pembelajaran Fisika – Fluida Statis</i></p><h2>Pendahuluan</h2><p>Pernahkah kamu melihat seorang mekanik mengangkat mobil hanya dengan memompa tuas dongkrak? Benda seberat satu ton terangkat oleh tenaga tangan yang kecil. Modul ini mengajakmu memahami rahasia di balik peristiwa tersebut, yaitu <b>Hukum Pascal</b>.</p><div class='box'><b>Tujuan belajar:</b> setelah membaca modul ini kamu mampu (1) menjelaskan hubungan gaya, luas penampang, dan tekanan; (2) menyelidiki hubungannya lewat percobaan; (3) menyelesaikan soal kontekstual Hukum Pascal.</div><h3>Isi Modul</h3><ol><li>Kasus: dongkrak di bengkel</li><li>Tekanan</li><li>Hukum Pascal</li><li>Penerapan dalam kehidupan</li><li>Contoh soal dan rangkuman</li></ol><p><b>Petunjuk:</b> baca berurutan dengan tombol di bawah, kerjakan pertanyaan pemantik di halaman 2, lalu lanjut ke Simulasi dan Praktikum.</p></section>
<section class='pg'><h2>Bab 1 · Kasus: Dongkrak di Bengkel</h2><p>Di sebuah bengkel, seorang mekanik dapat mengangkat mobil seberat ±1.000 kg hanya dengan menekan tuas dongkrak hidrolik menggunakan tangannya. Padahal gaya yang ia berikan jauh lebih kecil daripada berat mobil. Ia hanya memompa tuas beberapa kali, dan mobil naik perlahan.</p><div class='box'><b>Pertanyaan pemantik</b> – tuliskan dugaanmu sebelum membaca bab berikutnya.</div><label>1. Mengapa gaya kecil dapat mengangkat beban yang sangat berat?</label><textarea rows='3' data-k='p1'></textarea><label>2. Faktor apa saja yang menurutmu memengaruhi besar gaya keluaran?</label><textarea rows='3' data-k='p2'></textarea><button onclick="sf('mat')">Simpan & Kirim Jawaban</button></section>
<section class='pg'><h2>Bab 2 · Tekanan</h2><p>Tekanan adalah gaya yang bekerja tegak lurus pada tiap satuan luas permukaan.</p><div class='rm'><b>P = F / A</b></div><p>dengan P tekanan (Pa), F gaya (N), dan A luas penampang (m²). Satuan 1 Pa = 1 N/m².</p><div class='box'><b>Tahukah kamu?</b> Paku runcing mudah menembus kayu karena luas ujungnya sangat kecil, sehingga gaya yang sama menghasilkan tekanan yang besar.</div><p><b>Contoh.</b> Gaya 50 N bekerja pada luas 0,5 m². Tekanannya P = 50 / 0,5 = 100 Pa.</p><p>Jadi, untuk gaya yang sama, makin kecil luas penampang makin besar tekanannya.</p></section>
<section class='pg'><h2>Bab 3 · Hukum Pascal</h2><div class='box'><b>Bunyi:</b> tekanan yang diberikan pada fluida dalam ruang tertutup diteruskan sama besar ke segala arah.</div><p>Pada dongkrak hidrolik, piston kecil (luas A₁) ditekan dengan gaya F₁. Tekanan yang timbul diteruskan oleh fluida ke piston besar (luas A₂).</p><div style='text-align:center'><svg viewBox='0 0 420 170' width='100%' style='max-width:420px' font-size='13' font-family='system-ui'><rect x='50' y='85' width='320' height='55' fill='#8ab4f8' opacity='.5'/><g stroke='currentColor' stroke-width='2' fill='none'><path d='M50 30V140H370V30M90 30V85M250 30V85'/></g><rect x='52' y='52' width='36' height='8' fill='currentColor'/><rect x='252' y='52' width='116' height='8' fill='currentColor'/><g fill='currentColor' text-anchor='middle'><text x='70' y='14'>F₁ ↓</text><text x='310' y='14'>F₂ ↑</text><text x='70' y='110'>A₁</text><text x='310' y='110'>A₂</text></g></svg><div class='mu'>Gambar 1. Skema dongkrak hidrolik</div></div><p>Karena tekanan di kedua piston sama (P₁ = P₂):</p><div class='rm'>F₁ / A₁ = F₂ / A₂ &nbsp;→&nbsp; <b>F₂ = F₁ × (A₂ / A₁)</b></div><p>Artinya, makin besar perbandingan A₂ terhadap A₁, makin besar gaya yang dihasilkan piston besar.</p></section>
<section class='pg'><h2>Bab 4 · Penerapan Hukum Pascal</h2><p>Perbandingan A₂/A₁ disebut <b>keuntungan mekanik</b>. Jika A₂ = 10 × A₁, maka gaya keluaran 10 kali gaya masukan.</p><ul><li><b>Dongkrak hidrolik</b> – mengangkat mobil.</li><li><b>Rem hidrolik</b> – injakan pedal diteruskan ke piston rem di tiap roda.</li><li><b>Mesin press hidrolik</b> – menekan atau membentuk logam.</li><li><b>Kursi dokter gigi dan lift hidrolik</b> – menaikkan beban dengan halus.</li></ul><div class='box'><b>Catatan:</b> gaya kecil memang menghasilkan gaya besar, tetapi piston kecil harus bergerak lebih jauh. Energi tidak dilipatgandakan.</div></section>
<section class='pg'><h2>Bab 5 · Contoh Soal dan Rangkuman</h2><p><b>Soal.</b> Dongkrak memiliki A₁ = 10 cm² dan A₂ = 100 cm². Jika F₁ = 20 N, berapa F₂ dan tekanan pada piston kecil?</p><p><b>Diketahui:</b> A₁ = 10 cm², A₂ = 100 cm², F₁ = 20 N<br><b>Ditanya:</b> F₂ dan P₁<br><b>Jawab:</b> F₂ = F₁ × A₂/A₁ = 20 × 100/10 = <b>200 N</b>; P₁ = F₁/A₁ = 20/10 = <b>2 N/cm²</b>.</p><h3>Rangkuman</h3><ul><li>Tekanan P = F/A.</li><li>Hukum Pascal: tekanan pada fluida tertutup diteruskan sama besar.</li><li>F₁/A₁ = F₂/A₂, sehingga F₂ = F₁ × A₂/A₁.</li></ul><p>Lanjutkan ke menu <b>Simulasi</b> dan <b>Praktikum (LKPD)</b>.</p></section>
<div class='bn'><button id='pv' class='sec' onclick='mp(mpn-1)'>← Sebelumnya</button><span class='mu'>Baca dengan teliti</span><button id='nx' onclick='mp(mpn+1)'>Berikutnya →</button></div></div>`;

const tk='(?:\\([^()]*\\)|[A-Za-z0-9.,_^{}₀-₉²³ρΔ]+)',rx=new RegExp('('+tk+')\\s*\\/\\s*('+tk+')','g'),st=x=>x.replace(/^\(([^()]*)\)$/,'$1');

return h.replace(/\*/g,'×').replace(/sqrt\(([^()]*)\)/g,'√<span style="border-top:1.5px solid currentColor">$1</span>').replace(/\^(\{[^}]*\}|[A-Za-z0-9+\-]+)/g,(m,a)=>`<sup>${a.replace(/[{}]/g,'')}</sup>`).replace(/_(\{[^}]*\}|[A-Za-z0-9]+)/g,(m,a)=>`<sub>${a.replace(/[{}]/g,'')}</sub>`).replace(/\n/g,'<br>')}

P.lat=()=>`<div class='card'><h2>Latihan Soal Kontekstual</h2><p class='mu'>Tuliskan diketahui dan ditanya, persamaan, langkah penyelesaian, lalu jawaban akhir. Tekan <b>Minta Umpan Balik</b> untuk mendapat saran dari asisten; kamu boleh memperbaiki jawabanmu lalu meminta umpan balik lagi. Setelah selesai, tekan <b>Kirim Latihan ke Guru</b>.</p><p class='mu'>Editor persamaan: ketik <b>/</b> untuk pecahan (mis. F₁/A₁), <b>*</b> untuk ×, <b>^</b> pangkat, <b>_</b> subskrip, atau pakai tombol simbol di atas kolom.</p></div>${LQ.map((c,i)=>`<div class='card'><b>Soal ${i+1}.</b> ${c.q}${c.fig}<label>Diketahui dan ditanya</label><textarea rows='2' id='ds${i}' data-k='ds${i}'></textarea><label>Persamaan yang digunakan</label>${eqBar(i)}<textarea rows='2' class='eqf' id='eq${i}' data-q='${i}' data-k='eq${i}' oninput='pv(this)' onfocus='eqT=this'></textarea><div class='eqp' id='pveq${i}'></div><label>Langkah penyelesaian</label><textarea rows='3' class='eqf' id='dj${i}' data-q='${i}' data-k='dj${i}' oninput='pv(this)' onfocus='eqT=this'></textarea><div class='eqp' id='pvdj${i}'></div><label>Jawaban akhir (${c.u})</label><input id='na${i}' data-k='na${i}' autocomplete='off'><button type='button' onclick='lfb(${i})'>🤖 Minta Umpan Balik</button><div id='lf${i}'></div></div>`).join('')}<div class='card'><button onclick="sf('lat')">Kirim Latihan ke Guru</button></div>`;

P.rem=()=>{if(me.role=='guru')return`<div class='card'><h2>Remedial</h2><p>Remedial aktif otomatis untuk siswa yang skor posttest-nya di bawah KKM (${KKM}). Hasilnya tampil di Rekapitulasi Nilai.</p></div>`;const p=gv('post'),d=gv('rem');if(p.s==null)return`<div class='card'><h2>Remedial</h2><p>Remedial akan aktif otomatis jika skor posttest kamu di bawah KKM (${KKM}). Kerjakan Posttest terlebih dahulu.</p></div>`;if(p.s>=KKM)return`<div class='card'><h2 class='ok'>Tidak perlu remedial</h2><p>Skor posttest ${p.s} sudah mencapai KKM ${KKM}. Lanjutkan ke pengayaan di menu Posttest.</p></div>`;return`<div class='card'><h2 class='err'>Remedial</h2><p>Skor posttest: <b>${p.s}</b> (KKM ${KKM}). Ikuti dua langkah berikut sampai tuntas.</p></div><div class='card'><h3>Langkah 1 – Pelajari ulang</h3><ul><li>Tekanan: P = F / A</li><li>Hukum Pascal: tekanan pada fluida tertutup diteruskan sama besar, sehingga F₁/A₁ = F₂/A₂</li><li>Gaya keluaran: F₂ = F₁ × A₂/A₁, keuntungan mekanik = A₂/A₁</li></ul><p>Buka kembali <a href='#' onclick="gp('mat');return false">Materi</a> atau coba <a href='#' onclick="gp('sim');return false">Simulasi</a>.</p><h3>Soal posttest yang masih salah</h3>${QZ.post.map((q,i)=>p.a[i]==q[2]?'':`<div class='q'><p>${i+1}. ${q[0]}</p>${q[4]||''}<b>Jawaban benar:</b> ${AB[q[2]]}. ${q[1][q[2]]}<p class='mu'>${q[5]||''}</p></div>`).join('')}</div><div class='card'><h3>Langkah 2 – Kerjakan soal remedial</h3>${d.n?`<p class='mu'>Percobaan ke-${d.n}${d.best!=null?' · nilai terbaik '+d.best:''}</p>`:''}${quiz('rem')}${d.s!=null?(d.s>=KKM?`<p class='ok'><b>✔ Remedial tuntas.</b> Nilai remedial tercatat di rekap guru.</p>`:`<p class='err'><b>Belum tuntas.</b> Pelajari lagi lalu ulangi.</p><button onclick='rr()'>Ulangi Remedial</button>`):''}</div>`};
P.sim=()=>`<div class='card'><h2>Simulasi AMYLAB – Dongkrak Hidrolik</h2><p>Atur gaya dan luas penampang, tekan piston kecil, lalu amati gaya pada piston besar. Gambar bersifat skematis.</p><div style='display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px'><label>Gaya F₁: <b id='o1'></b> N<input id='s1' type='range' min='1' max='200' value='20' oninput='hs()'></label><label>Luas A₁: <b id='o2'></b> cm²<input id='s2' type='range' min='1' max='50' value='10' oninput='hs()'></label><label>Luas A₂: <b id='o3'></b> cm²<input id='s3' type='range' min='10' max='500' step='5' value='100' oninput='hs()'></label></div><svg id='sv' viewBox='0 0 520 250' width='100%' style='max-width:580px;display:block;margin:6px auto' font-size='13' font-family='system-ui'></svg><div style='display:flex;gap:8px;flex-wrap:wrap'><button onclick='hp(1)'>⬇ Tekan Piston</button><button class='sec' onclick='hp(0)'>↺ Lepas</button><button class='sec' onclick='hc()'>📋 Catat ke Tabel LKPD</button></div><div class='card' style='margin-top:12px'><div id='so'></div></div></div>`;
function hs(){if(!$('#sv'))return;$('#o1').textContent=v('s1');$('#o2').textContent=v('s2');$('#o3').textContent=v('s3');const F=+v('s1'),A1=+v('s2'),A2=+v('s3'),F2=F*A2/A1;$('#so').innerHTML=`Tekanan P = F₁/A₁ = <b>${(F/A1).toFixed(2)} N/cm²</b> (${(F/A1*1e4).toLocaleString('id-ID',{maximumFractionDigits:0})} Pa)<br>Gaya piston besar F₂ = F₁ × A₂/A₁ = <b>${F2.toFixed(1)} N</b><br>Keuntungan mekanik = A₂/A₁ = <b>${(A2/A1).toFixed(1)}×</b><br>Piston kecil turun 10 cm → piston besar naik <b>${(10*A1/A2).toFixed(2)} cm</b><br>Beban yang dapat diangkat ≈ <b>${(F2/10).toFixed(1)} kg</b> (g = 10 m/s²)`;hd()}
function hd(){const e=$('#sv');if(!e)return;const F=+v('s1'),A1=+v('s2'),A2=+v('s3'),w1=20+Math.sqrt(A1)*5,w2=20+Math.sqrt(A2)*9,d1=ht*40,y1=90+d1,y2=90-d1*A1/A2,m=F*A2/A1/10,fl="fill='#8ab4f8' opacity='.55'";e.innerHTML=`<rect x='30' y='170' width='460' height='60' ${fl}/><rect x='30' y='${y1+10}' width='${w1}' height='${160-y1}' ${fl}/><rect x='${490-w2}' y='${y2+10}' width='${w2}' height='${160-y2}' ${fl}/><path d='M30 60V230H490V60M${30+w1} 60V170H${490-w2} V60' stroke='currentColor' stroke-width='2' fill='none'/><rect x='30' y='${y1}' width='${w1}' height='10' fill='currentColor'/><rect x='${490-w2}' y='${y2}' width='${w2}' height='10' fill='currentColor'/><rect x='${490-w2*.9}' y='${y2-36}' width='${w2*.8}' height='36' rx='4' fill='#0b8043'/><text x='${490-w2/2}' y='${y2-13}' text-anchor='middle' fill='#fff'>${m.toFixed(0)} kg</text><g fill='currentColor' text-anchor='middle'><text x='${30+w1/2}' y='${y1-14}'>F₁ = ${F} N ↓</text><text x='${30+w1/2}' y='205'>A₁</text><text x='${490-w2/2}' y='205'>A₂</text></g>`}
function hp(d){cancelAnimationFrame(hr);const s=ht,t0=performance.now();(function f(n){const k=Math.min(1,(n-t0)/1200);ht=s+(d-s)*k;hd();if(k<1)hr=requestAnimationFrame(f)})(t0)}
function hc(){const r=R().prak=R().prak||{};let i=1;while(i<=4&&r['f1'+i])i++;if(i>4)return alert('Tabel LKPD sudah penuh (4 baris).');r['f1'+i]=v('s1');r['a1'+i]=v('s2');r['a2'+i]=v('s3');r['f2'+i]=(+v('s1')*+v('s3')/+v('s2')).toFixed(1);save();alert('Data tercatat di baris '+i+' tabel LKPD.')}
const B={lat:()=>{lf('lat');document.querySelectorAll('#main .eqf').forEach(pv)},pre:()=>{},mat:()=>{lf('mat');mp(1)},prak:()=>lf('prak'),dis:()=>{lf('dis');ch()},ref:()=>lf('ref'),sim:()=>{ht=0;hs()},vid:()=>lf('vid'),post:()=>lf('post')};

function sm(){const a=+v('s1'),b=+v('s2'),c=+v('s3');if(!$('#so')||!b)return;const f=a*c/b;$('#so').innerHTML=`P = F₁/A₁ = <b>${(a/b).toFixed(2)} N/cm²</b> · F₂ = <b>${f.toFixed(1)} N</b> · Keuntungan mekanik = <b>${(c/b).toFixed(1)}×</b>`;$('#p1').style.height=Math.max(10,Math.min(130,130*b/Math.max(b,c)))+'px';$('#p2').style.height=Math.max(10,Math.min(130,130*c/Math.max(b,c)))+'px';$('#p1').textContent='A₁';$('#p2').textContent='A₂'}
function gr(){const pts=[];for(let i=1;i<=4;i++){const f1=+v&&0,g=k=>parseFloat(document.querySelector(`[data-k="${k}${i}"]`).value);const F1=g('f1'),A1=g('a1');$('#pp'+i).textContent=F1&&A1?(F1/A1).toFixed(2):'–';const x=g('a2'),y=g('f2');if(!isNaN(x)&&!isNaN(y))pts.push([x,y])}
const c=$('#cv'),x=c.getContext('2d'),W=c.width,H=c.height,st=getComputedStyle(document.body).color;x.clearRect(0,0,W,H);x.strokeStyle=st;x.fillStyle=st;x.font='13px sans-serif';x.beginPath();x.moveTo(50,10);x.lineTo(50,H-40);x.lineTo(W-10,H-40);x.stroke();x.fillText('A₂ (cm²)',W/2,H-10);x.fillText('F₂ (N)',4,20);if(!pts.length)return;pts.sort((p,q)=>p[0]-q[0]);const mx=Math.max(...pts.map(p=>p[0]))||1,my=Math.max(...pts.map(p=>p[1]))||1,X=p=>50+p/mx*(W-80),Y=p=>H-40-p/my*(H-70);x.strokeStyle='#1a73e8';x.fillStyle='#1a73e8';x.beginPath();pts.forEach((p,i)=>{i?x.lineTo(X(p[0]),Y(p[1])):x.moveTo(X(p[0]),Y(p[1]))});x.stroke();pts.forEach(p=>{x.beginPath();x.arc(X(p[0]),Y(p[1]),4,0,7);x.fill();x.fillText(p[0]+','+p[1],X(p[0])+6,Y(p[1])-6)})}
function ch(){const e=$('#ch');if(!e)return;e.innerHTML=DB.chat.map(m=>`<div class="m ${m.e==me.email?'me':''}"><b>${m.n}${m.r=='guru'?' (Guru)':''}</b><br>${m.t.replace(/</g,'&lt;')}<div class="mu">${m.h}</div></div>`).join('')||'<p class="mu">Belum ada pesan.</p>';e.scrollTop=1e9}
